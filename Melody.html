<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Surprise 🎉</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        color: white;
    }

    .card {
        background: rgba(255,255,255,0.1);
        padding: 30px;
        border-radius: 20px;
        width: 380px;
        box-shadow: 0 0 30px #ff4d6d;
        text-align: center;
    }

    h2 {
        background: linear-gradient(90deg, #ffcc70, #ff4d6d, #c77dff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 3s linear infinite;
    }

    @keyframes shine {
        0% { background-position: 0%; }
        100% { background-position: 200%; }
    }

    .question {
        margin-top: 15px;
        text-align: left;
    }

    input {
        width: 100%;
        padding: 8px;
        margin-top: 6px;
        border-radius: 8px;
        border: none;
        outline: none;
    }

    button {
        margin-top: 20px;
        padding: 10px 25px;
        border: none;
        border-radius: 25px;
        background: #ff4d6d;
        color: white;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 0 15px #ff4d6d;
    }

    button:hover {
        background: #ff1e4d;
    }

    .wish {
        display: none;
        margin-top: 25px;
        font-size: 22px;
        font-weight: bold;
        animation: glow 1.5s infinite alternate;
    }

    @keyframes glow {
        from { text-shadow: 0 0 10px #ffd6e0; }
        to   { text-shadow: 0 0 30px #ffcc70; }
    }

    .error {
        color: #ffb3b3;
        margin-top: 10px;
    }
</style>
</head>

<body>

<div class="card">
    <h2>🎉 Birthday Riddle Game 🎉</h2>

    <div class="question">
        1. What is snap name?
        <input type="text" id="q1">
    </div>

    <div class="question">
        2. Enter the word for today special in V3 form
        <input type="text" id="q2">
    </div>

    <div class="question">
        3. A person who loves music is called as
        <input type="text" id="q3">
    </div>

    <button onclick="checkAnswers()">Submit</button>

    <div class="error" id="error"></div>

    <div class="wish" id="wish">
        ✨ Many more happy returns of the day Melody 🍰🎂❤️✨
    </div>
</div>

<script>
function checkAnswers() {
    const a1 = document.getElementById("q1").value.trim().toLowerCase();
    const a2 = document.getElementById("q2").value.trim().toLowerCase();
    const a3 = document.getElementById("q3").value.trim().toLowerCase();

    if (a1 === "melody" && a2 === "proposed" && a3 === "melophile") {
        document.getElementById("wish").style.display = "block";
        document.getElementById("error").innerText = "";
    } else {
        document.getElementById("error").innerText = "❌ Oops! Try again…";
        document.getElementById("wish").style.display = "none";
    }
}
</script>

</body>
</html>
