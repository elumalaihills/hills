<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Riddle Surprise 🎉</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1b1f3b, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
}

.card {
    width: 360px;
    padding: 28px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 30px #ff4d6d;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { box-shadow: 0 0 20px #ff4d6d; }
    to { box-shadow: 0 0 45px #ffb3c6; }
}

h2 {
    text-align: center;
    background: linear-gradient(90deg,#ffcc70,#ff4d6d,#c77dff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
}

@keyframes shine {
    0% { background-position: 0%; }
    100% { background-position: 200%; }
}

.question {
    margin-top: 16px;
}

input {
    width: 100%;
    margin-top: 6px;
    padding: 8px;
    border-radius: 8px;
    border: none;
    outline: none;
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    border-radius: 25px;
    border: none;
    background: #ff4d6d;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #ff1e4d;
}

.error {
    margin-top: 10px;
    color: #ffb3b3;
    text-align: center;
}

.wish {
    display: none;
    margin-top: 25px;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="card">
    <h2>🎉 Birthday Riddles 🎉</h2>

    <div class="question">
        1. What is snap name?
        <input id="q1" type="text">
    </div>

    <div class="question">
        2. Enter the word for today special in V3 form
        <input id="q2" type="text">
    </div>

    <div class="question">
        3. A person who loves music is called as
        <input id="q3" type="text">
    </div>

    <button onclick="check()">Submit</button>

    <div class="error" id="error"></div>

    <div class="wish" id="wish">
        ✨ Many more happy returns of the day Melody 🍰🎂❤️✨
    </div>
</div>

<script>
function check() {
    const a1 = document.getElementById("q1").value.trim().toLowerCase();
    const a2 = document.getElementById("q2").value.trim().toLowerCase();
    const a3 = document.getElementById("q3").value.trim().toLowerCase();

    if (a1 === "melody" && a2 === "proposed" && a3 === "melophile") {
        document.getElementById("wish").style.display = "block";
        document.getElementById("error").innerText = "";
    } else {
        document.getElementById("error").innerText = "❌ Wrong answer… try again";
        document.getElementById("wish").style.display = "none";
    }
}
</script>

</body>
</html>
