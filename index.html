<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Riddle Surprise 🎉</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: radial-gradient(circle at top, #1a1a40, #000);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', sans-serif;
        color: white;
        overflow: hidden;
    }

    .container {
        background: rgba(255,255,255,0.08);
        padding: 30px;
        border-radius: 20px;
        width: 360px;
        box-shadow: 0 0 30px #ff4d6d;
        animation: glow 2s infinite alternate;
    }

    @keyframes glow {
        from { box-shadow: 0 0 20px #ff4d6d; }
        to   { box-shadow: 0 0 45px #ffd6e0; }
    }

    h1 {
        text-align: center;
        background: linear-gradient(90deg, #ffcc70, #ff4d6d, #c77dff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 3s linear infinite;
    }

    @keyframes shine {
        0% { background-position: 0%; }
        100% { background-position: 200%; }
    }

    .question {
        margin-top: 20px;
        font-size: 16px;
    }

    .answer {
        color: #ffcc70;
        margin-top: 5px;
        font-weight: bold;
    }

    .wish {
        margin-top: 30px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.08); }
        100% { transform: scale(1); }
    }

    .sparkle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: white;
        border-radius: 50%;
        animation: sparkle 3s infinite;
    }

    @keyframes sparkle {
        0% { opacity: 0; transform: translateY(0); }
        50% { opacity: 1; }
        100% { opacity: 0; transform: translateY(-100px); }
    }
</style>
</head>

<body>

<div class="container">
    <h1>🎉 Birthday Riddles 🎉</h1>

    <div class="question">
        1. What is snap name?
        <div class="answer">👉 Melody</div>
    </div>

    <div class="question">
        2. Enter the word for today special in V3 form
        <div class="answer">👉 Proposed</div>
    </div>

    <div class="question">
        3. A person who loves music is called as
        <div class="answer">👉 Melophile</div>
    </div>

    <div class="wish">
        ✨ Many more happy returns of the day Melody 🍰🎂❤️✨
    </div>
</div>

<!-- sparkles -->
<script>
    for (let i = 0; i < 30; i++) {
        let s = document.createElement("div");
        s.className = "sparkle";
        s.style.left = Math.random() * 100 + "vw";
        s.style.top = Math.random() * 100 + "vh";
        s.style.animationDelay = Math.random() * 3 + "s";
        document.body.appendChild(s);
    }
</script>

</body>
</html>
